<rect x="0" y="0" width="1140" height="660" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1f2933">레버 커넥터로 펌프 리드 · 다이오드 잇기 (무납땜, STEP3)</text>
<text x="24.0" y="56.0" font-size="13" text-anchor="start" font-weight="normal" fill="#52606d">펌프마다 3구 레버 커넥터 PCT-413 2개(&quot;+&quot;와 &quot;−&quot;)를 씁니다. 한 구멍에 한 가닥, 피복은 9~10mm. 커넥터 안의 3구멍은 모두 이어져 있습니다.</text>
<text x="40.0" y="94.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2933">A. 레버 커넥터 쓰는 법</text>
<rect x="140.0" y="150.0" width="120.0" height="46.0" rx="6" fill="#e3edf7" stroke="#5b7da3" stroke-width="1.6"/>
<rect x="156.0" y="115.5" width="8.0" height="34.5" rx="2" fill="#f08c00" stroke="#b35c00" stroke-width="1"/>
<rect x="196.0" y="115.5" width="8.0" height="34.5" rx="2" fill="#f08c00" stroke="#b35c00" stroke-width="1"/>
<rect x="236.0" y="115.5" width="8.0" height="34.5" rx="2" fill="#f08c00" stroke="#b35c00" stroke-width="1"/>
<text x="40.0" y="124.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2933" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">① 레버를 끝까지 올림</text>
<line x1="152.0" y1="173.0" x2="152.0" y2="173.0" stroke="#b87333" stroke-width="4" stroke-linecap="round"/>
<rect x="140.0" y="260.0" width="120.0" height="46.0" rx="6" fill="#e3edf7" stroke="#5b7da3" stroke-width="1.6"/>
<rect x="156.0" y="225.5" width="8.0" height="34.5" rx="2" fill="#f08c00" stroke="#b35c00" stroke-width="1"/>
<rect x="196.0" y="225.5" width="8.0" height="34.5" rx="2" fill="#f08c00" stroke="#b35c00" stroke-width="1"/>
<rect x="236.0" y="225.5" width="8.0" height="34.5" rx="2" fill="#f08c00" stroke="#b35c00" stroke-width="1"/>
<text x="40.0" y="234.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2933" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">② 9~10mm 벗긴 선을 끝까지</text>
<polyline points="30.0,283.0 120.0,283.0" fill="none" stroke="#d64545" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="120.0" y1="283.0" x2="152.0" y2="283.0" stroke="#b87333" stroke-width="4" stroke-linecap="round"/>
<rect x="140.0" y="370.0" width="120.0" height="46.0" rx="6" fill="#e3edf7" stroke="#5b7da3" stroke-width="1.6"/>
<rect x="148.0" y="364.0" width="24.0" height="6.0" rx="2" fill="#f08c00" stroke="#b35c00" stroke-width="1"/>
<rect x="188.0" y="364.0" width="24.0" height="6.0" rx="2" fill="#f08c00" stroke="#b35c00" stroke-width="1"/>
<rect x="228.0" y="364.0" width="24.0" height="6.0" rx="2" fill="#f08c00" stroke="#b35c00" stroke-width="1"/>
<text x="40.0" y="344.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2933" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">③ 레버를 내리고 살짝 당겨 봄</text>
<polyline points="30.0,393.0 120.0,393.0" fill="none" stroke="#d64545" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="120.0" y1="393.0" x2="152.0" y2="393.0" stroke="#b87333" stroke-width="4" stroke-linecap="round"/>
<text x="40.0" y="470.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• 투명 몸통으로 심선 끝이 안쪽 벽에 닿았는지 봄</text>
<text x="40.0" y="490.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• 피복이 안에 물리면(짧게 벗김) 접촉 불량,</text>
<text x="40.0" y="508.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">  심선이 밖에 보이면(길게 벗김) 단락 위험</text>
<text x="40.0" y="528.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• 헐거우면 피복을 두 배(약 20mm) 벗겨</text>
<text x="40.0" y="546.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">  반으로 접어 꼬아 넣음(들어가는 길이는 같음)</text>
<text x="40.0" y="566.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• 레버를 다시 올리면 빼고 고쳐 꽂을 수 있음</text>
<text x="400.0" y="94.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2933">B. 펌프 하나의 결선 (뚜껑 위)</text>
<rect x="540.0" y="150.0" width="150.0" height="56.0" rx="6" fill="#e3edf7" stroke="#5b7da3" stroke-width="1.6"/>
<rect x="550.0" y="144.0" width="30.0" height="6.0" rx="2" fill="#f08c00" stroke="#b35c00" stroke-width="1"/>
<rect x="600.0" y="144.0" width="30.0" height="6.0" rx="2" fill="#f08c00" stroke="#b35c00" stroke-width="1"/>
<rect x="650.0" y="144.0" width="30.0" height="6.0" rx="2" fill="#f08c00" stroke="#b35c00" stroke-width="1"/>
<text x="615.0" y="138.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">&quot;+&quot; 커넥터 (PCT-413)</text>
<rect x="540.0" y="330.0" width="150.0" height="56.0" rx="6" fill="#e3edf7" stroke="#5b7da3" stroke-width="1.6"/>
<rect x="550.0" y="324.0" width="30.0" height="6.0" rx="2" fill="#f08c00" stroke="#b35c00" stroke-width="1"/>
<rect x="600.0" y="324.0" width="30.0" height="6.0" rx="2" fill="#f08c00" stroke="#b35c00" stroke-width="1"/>
<rect x="650.0" y="324.0" width="30.0" height="6.0" rx="2" fill="#f08c00" stroke="#b35c00" stroke-width="1"/>
<text x="615.0" y="402.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">&quot;−&quot; 커넥터 (PCT-413)</text>
<line x1="615.0" y1="206.0" x2="615.0" y2="232.0" stroke="#9aa5b1" stroke-width="2.4" stroke-linecap="round"/>
<rect x="606.0" y="232.0" width="18.0" height="62.0" rx="4" fill="#2b2b2b" stroke="#1f2933" stroke-width="1"/>
<rect x="606.0" y="234.0" width="18.0" height="10.0" rx="0" fill="#c8ced6" stroke="none" stroke-width="1.5"/>
<line x1="615.0" y1="294.0" x2="615.0" y2="330.0" stroke="#9aa5b1" stroke-width="2.4" stroke-linecap="round"/>
<line x1="625.0" y1="240.0" x2="760.0" y2="236.0" stroke="#52606d" stroke-width="1" stroke-linecap="round"/>
<circle cx="625.0" cy="240.0" r="2.4" fill="#52606d" stroke="none" stroke-width="1.5"/>
<text x="764.0" y="240.3" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">다이오드 1N4007 — 띠(캐소드) 쪽 다리 → &quot;+&quot; 커넥터</text>
<line x1="625.0" y1="290.0" x2="760.0" y2="262.0" stroke="#52606d" stroke-width="1" stroke-linecap="round"/>
<circle cx="625.0" cy="290.0" r="2.4" fill="#52606d" stroke="none" stroke-width="1.5"/>
<text x="764.0" y="266.3" font-size="12" text-anchor="start" font-weight="normal" fill="#52606d" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">(띠 옆 몸통에 빨간 점을 찍어 두면 헷갈리지 않음)</text>
<polyline points="690.0,178.0 1000.0,178.0" fill="none" stroke="#d64545" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="690.0,358.0 1000.0,358.0" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="870.0" y="168.0" font-size="12" text-anchor="start" font-weight="bold" fill="#d64545" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">연장선 빨강 → 박스: 릴레이 K NO</text>
<text x="870.0" y="348.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">연장선 검정 → 박스: TB2</text>
<text x="1000.0" y="382.0" font-size="12" text-anchor="end" font-weight="normal" fill="#52606d" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">AWG20 2심 약 70cm</text>
<rect x="400.0" y="440.0" width="330.0" height="14.0" rx="3" fill="#eef1f4" stroke="#1f2933" stroke-width="1.4"/>
<text x="410.0" y="472.0" font-size="12" text-anchor="start" font-weight="normal" fill="#52606d" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">뚜껑 윗면 (Ø5 구멍)</text>
<rect x="455.0" y="440.0" width="10.0" height="14.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<polyline points="458.0,486.0 458.0,430.0 458.0,178.0 540.0,178.0" fill="none" stroke="#d64545" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="462.0,486.0 462.0,430.0 500.0,358.0 540.0,358.0" fill="none" stroke="#222222" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="430.0" y="486.0" width="70.0" height="30.0" rx="6" fill="#9aa5b1" stroke="#1f2933" stroke-width="1.2"/>
<text x="465.0" y="506.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">펌프</text>
<text x="470.0" y="168.0" font-size="12" text-anchor="start" font-weight="bold" fill="#d64545" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">펌프 빨강</text>
<text x="470.0" y="398.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">펌프 검정</text>
<rect x="520.0" y="116.0" width="200.0" height="292.0" rx="12" fill="none" stroke="#2f9e44" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="732.0" y="404.0" font-size="12" text-anchor="start" font-weight="bold" fill="#2f9e44" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">절연테이프로 한 덩어리 →</text>
<text x="732.0" y="422.0" font-size="12" text-anchor="start" font-weight="bold" fill="#2f9e44" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">연장선에 케이블타이 (뚜껑에서 1~2cm 위)</text>
<text x="400.0" y="546.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2933">C. 순서 (펌프 4개 모두)</text>
<rect x="400.0" y="560.0" width="174.0" height="84.0" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.2"/>
<text x="410.0" y="584.0" font-size="15" text-anchor="start" font-weight="bold" fill="#e8590c">①</text>
<text x="432.0" y="584.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">연장선 빨강·검정과</text>
<text x="432.0" y="603.0" font-size="12" text-anchor="start" font-weight="normal" fill="#52606d">다이오드를 먼저 꽂음</text>
<rect x="582.0" y="560.0" width="174.0" height="84.0" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.2"/>
<text x="592.0" y="584.0" font-size="15" text-anchor="start" font-weight="bold" fill="#e8590c">②</text>
<text x="614.0" y="584.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">박스 쪽 끝에서 ▶| 확인</text>
<text x="614.0" y="603.0" font-size="12" text-anchor="start" font-weight="normal" fill="#52606d">검정→빨강 선: 0.5~0.7</text>
<text x="614.0" y="622.0" font-size="12" text-anchor="start" font-weight="normal" fill="#52606d">반대로 대면: OL</text>
<rect x="764.0" y="560.0" width="174.0" height="84.0" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.2"/>
<text x="774.0" y="584.0" font-size="15" text-anchor="start" font-weight="bold" fill="#e8590c">③</text>
<text x="796.0" y="584.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">펌프 빨강 → &quot;+&quot; 빈 구멍</text>
<text x="796.0" y="603.0" font-size="12" text-anchor="start" font-weight="normal" fill="#52606d">펌프 검정 → &quot;−&quot; 빈 구멍</text>
<rect x="946.0" y="560.0" width="174.0" height="84.0" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.2"/>
<text x="956.0" y="584.0" font-size="15" text-anchor="start" font-weight="bold" fill="#e8590c">④</text>
<text x="978.0" y="584.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">당김 테스트</text>
<text x="978.0" y="603.0" font-size="12" text-anchor="start" font-weight="normal" fill="#52606d">→ 절연테이프로 감기</text>
<text x="978.0" y="622.0" font-size="12" text-anchor="start" font-weight="normal" fill="#52606d">→ 케이블타이 고정</text>
<text x="40.0" y="600.0" font-size="12" text-anchor="start" font-weight="bold" fill="#c92a2a" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">⚠ 펌프를 꽂은 뒤에는 다이오드 방향을</text>
<text x="40.0" y="618.0" font-size="12" text-anchor="start" font-weight="bold" fill="#c92a2a" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">   잴 수 없음 — 꼭 ②를 ③보다 먼저</text>
<text x="40.0" y="640.0" font-size="12" text-anchor="start" font-weight="bold" fill="#c92a2a" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">⚠ 레버 커넥터는 방수가 아님</text>
</svg>
