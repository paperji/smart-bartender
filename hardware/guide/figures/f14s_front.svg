<text x="200.0" y="410.0" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2933" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">↑ GND 이음점: ㉛ + 짧은 검정 3가닥을 꼬아 한 점 납땜 (수축튜브는 ㉛에 먼저)</text>
