<text x="330.0" y="240.0" font-size="11" text-anchor="start" font-weight="normal" fill="#52606d" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">주황 점 = 납땜 + 수축튜브</text>
<text x="330.0" y="256.0" font-size="11" text-anchor="start" font-weight="normal" fill="#52606d" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">부저 핀 쪽은 노랑 끝에 듀폰 F를 납땜해 꽂음</text>
<text x="770.0" y="124.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2933" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">㉝</text>
<text x="770.0" y="144.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2933" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">㉟</text>
<text x="770.0" y="216.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2933" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">㉙</text>
<text x="770.0" y="236.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2933" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">㉚</text>
<text x="770.0" y="376.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2933" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">㉛</text>
<rect x="800.0" y="90.0" width="320.0" height="260.0" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.2"/>
<text x="812.0" y="112.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933">→ 전장 박스로 (STEP10)</text>
<text x="812.0" y="134.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933">㉙ 부저 VCC ← TB3-3 (3V3) · 노랑</text>
<text x="812.0" y="152.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933">㉚ 부저 I/O ← GPIO23 (J3-2) · 노랑</text>
<text x="812.0" y="170.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933">㉝ 버튼 단자 1 ← GPIO4 (J3-13) · 노랑</text>
<text x="812.0" y="188.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933">㉟ R1 → LED 긴 다리 ← GPIO2 (J3-15) · 노랑</text>
<text x="812.0" y="206.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933">㉛ GND → ESP32 GND (J3-7) · 검정</text>
<text x="812.0" y="224.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933">㉜·㉞·㊱ 부저·버튼 2·LED 짧은 다리 → GND 이음점</text>
<text x="812.0" y="242.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933"></text>
<text x="812.0" y="260.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933">박스 쪽 끝은 STEP10 절차 4에서 앞 벽 Ø10 구멍으로</text>
<rect x="40.0" y="450.0" width="1080.0" height="140.0" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.2"/>
<text x="52.0" y="472.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2933">알아 둘 것</text>
<text x="52.0" y="494.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">학교 실습실(2차 방문)에서 납땜 · 납땜 전에 수축튜브부터 끼우기 · 버튼 단자 1·2는 납땜 전에 고르기</text>
<text x="52.0" y="513.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">점검: ㉝–㉛은 버튼을 누를 때만 &quot;삐&quot;, ㉙–㉛·㉟–㉛은 계속 &quot;삐&quot;면 단락</text>
<text x="52.0" y="532.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">F와 전장 박스 사이는 약 35mm — 부품·커넥터가 튀어나오지 않게</text>
</svg>
