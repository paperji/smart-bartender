<rect x="0" y="0" width="1140" height="620" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1f2933">앞판 F 안쪽 배선 (납땜 기준, STEP9 절차 다 8)</text>
<text x="24.0" y="56.0" font-size="13" text-anchor="start" font-weight="normal" fill="#52606d">앞판 F를 안쪽(뒤)에서 본 모습 — 앞에서 볼 때와 좌우가 바뀝니다. 노랑 4가닥은 색이 같으므로 양 끝 번호 테이프로 구분합니다.</text>
