<text x="80.00" y="542.20" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR','NanumGothic',sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">3) 거스러미를 커터칼로 정리, 튜브·전선을 넣어 보고 맞춤 확인</text>
